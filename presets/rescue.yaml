name: Rescue
description: For genuinely bad recordings. Strong denoise, dereverb, bandwidth extension, and blended generative restoration. Content integrity is checked automatically.
stages:
  denoise:
    enabled: true
    engine: clearervoice
    strength: 1.0
  dereverb:
    enabled: true
    engine: separator
    strength: 1.0
  super_resolution:
    mode: auto
    engine: clearervoice
    bandwidth_threshold_hz: 14000
  generative_restore:
    enabled: true
    engine: resemble
    blend_mode: band
    wet: 0.5
    crossover_hz: 4000
finishing:
  high_pass_hz: 85
  high_pass_db_per_oct: 18
  mud_cut_hz: 300
  mud_cut_db: -2.0
  presence_hz: 3500
  presence_db: 1.5
  air_shelf_hz: 10000
  air_shelf_db: 1.5
  deesser_enabled: true
  compressor_enabled: true
  compressor_threshold_db: -20
  compressor_ratio: 3.5
  breath_reduction_enabled: false
  loudness_target: youtube
