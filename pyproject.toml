[project]
name = "studiovox"
version = "0.1.0"
description = "Local offline vocal enhancement studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "numpy>=2.4.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
